<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="c_glass_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#c_glass_grad)"/>
  
  <g transform="translate(14, 12) scale(0.6)">
      <!-- Trash Can Lid (Glassy) -->
      <path d="M10 10 h40 v6 h-40 z" fill="#fff" fill-opacity="0.4" stroke="#fff" stroke-width="2"/>
      <path d="M22 6 h16 v4 h-16 z" fill="#fff" fill-opacity="0.4" stroke="#fff" stroke-width="2"/>
      
      <!-- Trash Can Body (Main Container) -->
      <path d="M14 16 h32 l-4 40 h-24 z" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="2.5"/>
      
      <!-- Integrated Clock Interface (Tiny Detail) -->
      <!-- Moved to bottom center, very small like a brand logo -->
      <g transform="translate(30, 48) scale(0.4)">
          <circle cx="0" cy="0" r="10" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.6"/>
          <path d="M0 0 v-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M0 0 l4 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <!-- Glass Reflections -->
      <line x1="20" y1="20" x2="20" y2="40" stroke="#fff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
       <line x1="40" y1="20" x2="40" y2="40" stroke="#fff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  </g>
</svg>
