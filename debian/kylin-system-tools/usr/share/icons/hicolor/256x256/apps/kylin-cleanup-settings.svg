<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="settings_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="settings_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#settings_grad)" filter="url(#settings_shadow)" />
  <g transform="translate(14, 14) scale(0.56)">
    <!-- Slider Tracks -->
    <path d="M16 10 v44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M32 10 v44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M48 10 v44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Knobs -->
    <circle cx="16" cy="40" r="6" fill="#ffffff" />
    <circle cx="32" cy="20" r="6" fill="#ffffff" />
    <circle cx="48" cy="32" r="6" fill="#ffffff" />
  </g>
</svg>
