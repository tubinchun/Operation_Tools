<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="32" ry="32" fill="url(#bgGradient)"/>
  
  <!-- U盘主体 -->
  <g transform="translate(48, 40)">
    <!-- U盘外壳 -->
    <rect x="20" y="0" width="120" height="140" rx="8" ry="8" fill="url(#usbGradient)" stroke="#888" stroke-width="2"/>
    
    <!-- USB接口 -->
    <rect x="40" y="140" width="80" height="35" rx="2" ry="2" fill="#A0A0A0" stroke="#666" stroke-width="2"/>
    
    <!-- USB接口内部金属触点 -->
    <rect x="50" y="148" width="12" height="20" fill="#C9A227"/>
    <rect x="74" y="148" width="12" height="20" fill="#C9A227"/>
    <rect x="98" y="148" width="12" height="20" fill="#C9A227"/>
    
    <!-- U盘指示灯 -->
    <circle cx="80" cy="25" r="8" fill="#4CAF50">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 盾牌装饰 (表示保护/修复) -->
    <g transform="translate(45, 45)">
      <path d="M35,0 L70,15 L70,45 C70,70 35,85 35,85 C35,85 0,70 0,45 L0,15 Z" 
            fill="#4CAF50" opacity="0.9"/>
      <!-- 对勾符号 -->
      <path d="M15,42 L28,55 L55,25" 
            fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- 工具图标提示 -->
  <g transform="translate(175, 175)">
    <circle cx="30" cy="30" r="28" fill="#FF9800" stroke="white" stroke-width="3"/>
    <!-- 扳手符号 -->
    <path d="M20,40 L40,20 M35,25 L40,20 L35,15" 
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
